<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- SEO:START — per-route <title>/description/OG/Twitter. These static values are the
         homepage defaults and the fallback the CDN serves to humans; server/seo (roadmap
         Phase 2) replaces this whole block per URL for crawlers & social scrapers. -->
    <meta name="description" content="Clarity for every stage of homeownership. Get pre-approved in minutes with a clear, calm mortgage experience. No jargon, no stress." />
    <meta property="og:title" content="Homiquity - Clarity for Every Stage of Homeownership" />
    <meta property="og:description" content="Get pre-approved in minutes. Clear, calm, and achievable homeownership starts here." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homiquity" />
    <meta property="og:url" content="https://www.homiquity.com/" />
    <meta property="og:image" content="https://www.homiquity.com/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Homiquity - Clarity for Every Stage of Homeownership" />
    <meta name="twitter:description" content="Get pre-approved in minutes. Clear, calm, and achievable homeownership starts here." />
    <meta name="twitter:image" content="https://www.homiquity.com/og-card.png" />
    <title>Homiquity - Clarity for Every Stage of Homeownership</title>
    <!-- SEO:END -->
    <!-- Icons. All generated from client/public/brand/master-compact.png by
         `pnpm brand:assets` — never hand-edit them, and never add one here that
         the manifest does not emit, or `pnpm brand:assets --check` cannot see it.
         The COMPACT artwork is deliberate: the primary mark's outlined stem and
         chart columns turn to mush below ~48px. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1E19" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Geist is the single product and marketing face. Inter remains a local
         fallback and does not need a second network request. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <!-- Global structured data (schema.org). Organization + WebSite live here so
         non-JS crawlers see the entity on every route; per-page schema (Article,
         FAQPage, DefinedTermSet, BreadcrumbList) is injected client-side by SEOHead.
         F1: add "identifier" (NMLS #) to the Organization once licensing lands —
         never emit a placeholder identifier while it is PENDING. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "FinancialService"],
          "@id": "https://www.homiquity.com/#organization",
          "name": "Homiquity",
          "legalName": "Homiquity Mortgage Corporation",
          "url": "https://www.homiquity.com/",
          "logo": "https://www.homiquity.com/icon-512.png",
          "image": "https://www.homiquity.com/og-card.png",
          "slogan": "Clarity for every stage of homeownership.",
          "description": "Homiquity is a mortgage brokerage focused on a clear, calm homebuying experience — guidance and support at every stage of homeownership.",
          "areaServed": "US"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.homiquity.com/#website",
          "url": "https://www.homiquity.com/",
          "name": "Homiquity",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://www.homiquity.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.homiquity.com/learn?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
