# Checks repository records only. Actual scheduler registration requires a live application read.
name: Source and instruction records

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    name: source and instruction records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Source records and document dispositions
        run: pnpm guard:sources
