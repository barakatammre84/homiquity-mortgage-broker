name: CI

# Two roles:
#   gate         — on every PR to main: typecheck + unit tests (node + client component
#                  suites) + prod-dependency audit (high/critical) + schema↔migration
#                  drift guard + design-token ratchet. This is the required check for
#                  the auto-merge-green policy; a schema change without a migration or
#                  a raw palette class over baseline goes RED and cannot merge.
#   migrate-prod — on merge to main: apply any pending migrations to PROD so the
#                  database is never left behind the code (the 2026-07-13 outage cause).
#                  Also runnable manually (workflow_dispatch) — defaults to a DRY RUN,
#                  which is the runbook's mandatory pre-flight. Scope note: the dry run
#                  reconciles the JOURNAL (what does prod think is pending?) and never
#                  executes a migration's SQL, so it cannot pre-flight a CONTRACT step
#                  (SET NOT NULL / CHECK / FK) that could fail on data — those need the
#                  read-only prod probe in knowledge-base/runbooks/DB_MIGRATIONS.md
#                  (§Contract migrations) BEFORE the migration is authored.
#
# Credentials: NO prod DB password is stored in GitHub. migrate-prod mints a fresh
# Neon DIRECT (unpooled) connection string at run time from NEON_API_KEY (provisioned
# by the Neon↔GitHub integration) via scripts/neon-connection-uri.cjs. A rotated
# Neon password therefore never breaks CI, and there is no second copy of the
# credential to leak.
#
# Prereqs (one-time, done in GitHub, not by Claude):
#   • Repo secret NEON_API_KEY — added automatically by the Neon↔GitHub integration.
#   • Repo variable NEON_PROJECT_ID — ONLY if the key can see more than one Neon
#     project (the script fails with the list of ids when it's ambiguous).
#   • Branch protection on `main` requiring the "gate" check (makes the gate binding).
#     ✅ LIVE AGAIN as of 2026-08-23 — and this comment has now been wrong in BOTH
#     directions, which is the actual lesson. It read "✅ CONFIGURED 2026-07-17" through
#     the weeks after protection was removed (2026-08-19, deliberately, so work could
#     continue through the Actions billing failure), and then read "🚨 NOT CONFIGURED —
#     `gate` is advisory" after it came back. A status line about a security control is
#     a claim about the day it was written, never a property of the repo.
#     Measured 2026-08-23 by BEHAVIOUR, which is the part that cannot go stale quietly:
#         gh api repos/<owner>/<repo>/branches/main --jq .protected          # → true
#         gh api repos/<owner>/<repo>/rules/branches/main --jq 'length'      # → 0
#           …so this is CLASSIC branch protection, not a ruleset. Check both: a
#           requirement living in one shows as empty in the other.
#       and the two observations that actually prove enforcement:
#         • merging #708/#647 through the API returned, verbatim:
#             405 Required status check "gate (typecheck · tests · schema guard)" is expected
#         • #647 went `behind` when `main` moved and merged only once brought current,
#           so `strict: true` (branch must be up to date) is on as well.
#     ⚠️ `…/branches/main/protection` returns 403 "Resource not accessible by
#     integration" to any non-admin token, so a session CANNOT read the contexts list —
#     which is precisely how the stale claims above survived on both sides. Probe the
#     behaviour, not the settings endpoint: open a PR and read what the merge refuses.
#     Consequence for anyone editing this file: `gate` is BINDING now. Renaming the job
#     deadlocks every open PR (see the DO-NOT-RENAME warning on the job below), and a red
#     PR can no longer be merged by anyone — the pre-push hook is no longer the only gate.

on:
  pull_request:
    # NO `branches:` FILTER, deliberately — every PR is gated, whatever its base.
    #
    # This carried `branches: [main]` until 2026-08-13. The effect was that a PR
    # based on another feature branch matched nothing and got ZERO check-runs for
    # its entire life, then ran for the first time only when someone retargeted it
    # to main — which is the moment they are about to merge it, i.e. the latest
    # possible moment and the one where a red result is most expensive.
    #
    # Worse, a zero-check PR does not LOOK unchecked. `gh pr view` reports
    # `mergeStateStatus: CLEAN`, which means "no merge conflicts" and says nothing
    # about CI; on a stacked PR the two are indistinguishable at a glance. Observed
    # on #517 and #518 (2026-08-13), both reported CLEAN with no run ever scheduled.
    # PR #425 (2026-08-06) was the same shape with auto-merge armed — nothing was
    # stopping it.
    #
    # Only the `gate` job can fire here: `migrate-prod` is `push ||
    # workflow_dispatch` and `verify-deploy` is `push`, so neither can be reached by
    # a pull_request event no matter what its base is. And the §9 guard diffs
    # from the MERGE-BASE of `github.event.pull_request.base.sha` and `head.sha`, so a PR
    # (stacked or not) is judged on its own changes only. This comment
    # claimed that property while the code used two dots and did not have it (F-0818-16),
    # which is why a wrong comment on a security control is itself a defect: it is what an
    # auditor reads instead of the command.
    #
    # `types` is explicit because the DEFAULT set (opened, synchronize, reopened)
    # silently skips two events this repo relies on:
    #
    #   edited      — fires on a base-branch retarget, which is now a re-gate
    #                 against the NEW base rather than the first gate ever. It also
    #                 fires on title/body edits, which is load-bearing:
    #                 `guard:security` reads the PR BODY from the event payload
    #                 (`github.event.pull_request.body`), so re-running an old run
    #                 replays the OLD body and can never see a security review added
    #                 after the fact. Observed on PR #424.
    #
    #   ready_for_review — a draft PR marked ready otherwise keeps whatever
    #                 (possibly no) checks it had as a draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — list pending migrations without applying them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    # ⚠️ DO NOT RENAME without updating branch protection in the same change. This
    # `name:` string IS the required status check on `main`, matched VERBATIM (the
    # separators are U+00B7 MIDDLE DOTs, not periods). Rename it and every future PR
    # deadlocks: the new check never satisfies the old required context, so the PR sits
    # "Expected — Waiting for status" forever, and enforce_admins=true means nobody can
    # bypass it. Rename procedure (both, together):
    #   gh api -X PATCH repos/OWNER/REPO/branches/main/protection/required_status_checks \
    #     -f 'contexts[]=<the exact new name>'
    # Recovery if it does deadlock: re-point the rule with the PATCH above, or turn
    # enforce_admins off temporarily (Settings → Branches). Both need repo admin.
    name: gate (typecheck · tests · schema guard)
    # DRAFTS ARE GATED. The exemption that used to sit in the `if:` below —
    # `github.event.pull_request.draft == false` — was removed on 2026-08-24.
    # The reason is written down because the same trap looks attractive every
    # time CI minutes get counted.
    #
    # It was added on an honest measurement, quoted verbatim from the comment it
    # replaces: "ZERO of the 60 PRs opened 2026-08-18..20 were drafts, so this
    # saves nothing TODAY." True when written. It stopped being true the moment
    # agent sessions began opening every PR as a draft by default: on 2026-08-24,
    # 14 of 23 open PRs were unchecked drafts, and 12 of the last 30 CI runs
    # concluded `skipped` — every one of them on a claude/* branch, among them a
    # P0 credential-leak fix. The exemption had quietly become the majority path.
    #
    # The merge gate was never the exposure: a draft cannot merge, and
    # `ready_for_review` is in `types`, so a full gate still ran before merge.
    # What the exemption removed was FEEDBACK DURING AUTHORING. A session pushes,
    # opens its draft, reads a clean check list, and ends its turn believing the
    # work is verified — no typecheck, no tests, none of the guards ever ran. It
    # is never told it was wrong, so it cannot correct, and the next session
    # reads that branch as precedent. That is this repo's signature defect —
    # scripts/test-collection-guard.cjs names it, "the operation does not happen
    # and nothing says so" — sitting on the gate itself.
    #
    # A draft is a work-in-progress signal, not a request to skip verification.
    # If CI minutes need cutting again, cut them where a verdict is not at stake:
    # the `concurrency` block below is the model. tests/ciTriggers.test.ts pins
    # this, so restoring the exemption reds the suite.
    #
    # ONE class of run still skips, and it is genuinely verdict-free:
    #
    #   body actually  — `edited` is in `types` because guard:security reads the
    #   changed          PR BODY from the event payload, so a security review
    #                    added after the fact must re-gate (observed on #424).
    #                    But `edited` also fires on a TITLE edit, and a title
    #                    cannot change any guard's verdict. `changes.body` is
    #                    present only when the body is what changed.
    #                    `changes.base` is deliberately NOT skipped: a retarget
    #                    arrives as `edited` and IS a real re-gate against a new
    #                    base.
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.action == 'edited'
           && !github.event.changes.body
           && !github.event.changes.base)
    # One in-flight gate per PR — a new push supersedes the old run instead of
    # racing it. Without this, every push to a branch started a fresh ~5-minute
    # run while the superseded one ran to completion for a commit nobody would
    # ever merge. The repo is PRIVATE, so those minutes are metered (KTLO-2):
    # measured 2026-08-17, 66 CI runs over 4.85 days (~13.6/day) at ~4-5 min
    # each is ~1,850 min/month against a 2,000-minute free allowance.
    #
    # SAFE BECAUSE OF THE `if:` ONE LINE ABOVE, not because of this group's key.
    # `gate` runs on pull_request ONLY, so cancel-in-progress structurally cannot
    # reach `migrate-prod` (push || workflow_dispatch) or `verify-deploy` (push)
    # — a cancelled deploy or a half-applied migration is the 2026-07-13 outage
    # class and is not reachable from here. tests/ciTriggers.test.ts pins both
    # that `if:` and this block together; if the `if:` is ever widened, THIS
    # becomes dangerous and that test is what says so.
    #
    # Cancelling is never a lost signal: a cancel only happens because a NEWER
    # run for the same PR started, and branch protection evaluates the latest
    # run for the head SHA. On an `edited` event that supersedes an in-flight
    # `synchronize`, the surviving run is the one carrying the NEWER PR body —
    # which is what guard:security needs to read.
    concurrency:
      group: gate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    services:
      # Disposable Postgres for the self-host boot probe (Railway migration
      # path): the probe applies the journal and boots dist/index.js against a
      # real database. Unit tests do NOT use this — they keep their hermetic
      # placeholder DATABASE_URL from vitest.config.ts.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: selfhost_boot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the §9 guard can diff base...head (three-dot needs the
          # merge-base to exist locally). The default shallow
          # checkout has neither sha, and a guard that cannot see the diff would
          # silently pass every PR.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Change scope (inert docs vs code)
        id: scope
        # KTLO-2, measured 2026-08-20: 2,393 billable Actions minutes over 14 days,
        # of which `gate` was 1,569 (356 runs x ~4 min after per-job round-up).
        # 36 of the 137 commits to `main` in that window changed NOTHING but prose —
        # routine reports, ledgers, the knowledge base — and each still paid a
        # typecheck, 3,000 unit tests, a production build and a self-host boot.
        #
        # This step splits the run in two. The doc guards below (kb index, staleness,
        # citations, §9, guard-script parse) ALWAYS run — they are ~1s combined and
        # they are exactly what a prose change needs. Everything expensive is skipped
        # when nothing but inert prose changed, which turns a ~4-minute billed run
        # into a ~1-minute one.
        #
        # 🚨 IT FAILS CLOSED, AND THAT ORDERING IS THE WHOLE SAFETY ARGUMENT. The cost
        # of a wrong `code=false` is a COMPLETELY UNGATED PR, so every uncertainty —
        # an empty diff, a missing sha, a git failure — resolves to `code=true`. Only
        # an affirmative, fully-classified all-prose diff turns the heavy steps off.
        #
        # 🚨 "INERT" IS NOT THE SAME AS ".md". `tests/scenarioCatalog.test.ts` reads
        # knowledge-base/compliance/UNDERWRITING_SCENARIOS.md from disk, so editing
        # that file CAN red the unit tests and it must stay on the code path. Any doc
        # a test reads is test-bearing, not inert. That coupling is not left to
        # memory: tests/ciTriggers.test.ts scans tests/ for .md reads and fails if one
        # is missing from TEST_BEARING below — so adding a new doc-reading test
        # without listing it here turns the suite red rather than silently skipping it.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Prose that no test and no guard-with-a-ratchet depends on.
          DOCS_RE: '(\.md|\.txt)$|^knowledge-base/|^docs/'
          # Docs a test reads from disk — changing one can red the suite, so it is code.
          TEST_BEARING_RE: '^knowledge-base/compliance/UNDERWRITING_SCENARIOS\.md$'
        run: |
          set -uo pipefail
          decide() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "scope: code=$1 ($2)"; }

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            decide true "no base/head sha on the event — cannot classify, so: code"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
          if [ -z "$changed" ]; then
            decide true "diff did not compute or is empty — cannot classify, so: code"; exit 0
          fi

          echo "--- changed files ---"; printf '%s\n' "$changed" | sed 's/^/  /'
          nondoc="$(printf '%s\n' "$changed" | grep -vE "$DOCS_RE" || true)"
          bearing="$(printf '%s\n' "$changed" | grep -E "$TEST_BEARING_RE" || true)"

          if [ -n "$nondoc" ]; then
            echo "--- non-doc files present ---"; printf '%s\n' "$nondoc" | sed 's/^/  /'
            decide true "at least one non-doc file changed"
          elif [ -n "$bearing" ]; then
            echo "--- test-bearing docs changed ---"; printf '%s\n' "$bearing" | sed 's/^/  /'
            decide true "a doc that a test reads from disk changed"
          else
            decide false "every changed file is inert prose"
          fi
      - name: Typecheck
        if: steps.scope.outputs.code == 'true'
        run: pnpm check
      - name: Unit tests
        # `pnpm test` is scripts/test-collection-guard.cjs — both unit lanes plus a
        # COLLECTED-COUNT FLOOR. Vitest globs test files through tinyglobby -> fdir,
        # which defaults to suppressErrors and reports a directory whose readdir
        # FAILED as an empty one. Under load that silently shortened three runs
        # (111/118, 214/215, 113/119), each exiting 0. The floor compares what
        # vitest reports collecting against what is on disk and fails on a
        # shortfall; it also fails on a test file no lane's include matches, which
        # never runs at all. (Job `name:` above deliberately unchanged — it is the
        # verbatim required-check string.)
        if: steps.scope.outputs.code == 'true'
        run: pnpm test
      - name: Dependency vulnerabilities (prod deps, high+)
        if: steps.scope.outputs.code == 'true'
        # Blocking scan — vulnerability-management program in
        # knowledge-base/governance/security/INFORMATION_SECURITY_POLICY.md §8.
        # High/critical only; moderates stay visible via `pnpm checkup`. (The job
        # `name:` above deliberately does not mention this step — it is the verbatim
        # required-check string; see the rename warning.)
        run: pnpm audit --prod --audit-level=high
      - name: Schema ↔ migration drift guard
        if: steps.scope.outputs.code == 'true'
        run: pnpm guard:schema
      - name: Migration ledger integrity
        if: steps.scope.outputs.code == 'true'
        # prod applies migrations/ automatically on merge, in journal `idx` order, so
        # a duplicate/missing/misnumbered entry is a production-DDL problem that only
        # surfaces after the merge button. Fails on duplicate idx or tag, a gap in the
        # 0..N-1 run, an entry with no .sql, an un-journalled .sql, and a filename
        # whose number disagrees with its idx. The case this exists for is the
        # 2026-08-04 double-`0038` near-miss (TEAM_PRACTICES §4), which was caught by
        # hand. (Job `name:` above deliberately unchanged — it is the verbatim
        # required-check string; see the rename warning.)
        run: pnpm guard:migrations
      - name: Delivery-stack freeze (F-14 channel decision)
        if: steps.scope.outputs.code == 'true'
        # A broker never delivers to Fannie Mae — the wholesale lender is the
        # seller/servicer. While shared/businessChannel.ts says "broker", the GSE
        # delivery stack may shrink but not grow, so the channel decision is not
        # made by accretion while it sits open. Turns itself off if the channel
        # flips to correspondent. (Job `name:` above deliberately unchanged — it is
        # the verbatim required-check string; see the rename warning.)
        run: pnpm guard:channel

      - name: Design-token ratchet
        if: steps.scope.outputs.code == 'true'
        # Raw-palette / bare-white-black counts vs scripts/design-token-baseline.json
        # (ratchet: counts may only go down). Gated 2026-07-19 — adjudication log §4
        # option 3, after the component-test lane stabilized baselines at 0/97. The
        # residual is the strict:false racing-merge window (TEAM_PRACTICES §5 traps):
        # two racing PRs can still combine into a red main, which the NEXT PR's gate
        # then surfaces — fix forward by retokening or ratcheting the baseline in that
        # PR. (Job `name:` above deliberately unchanged — verbatim required-check
        # string; see the rename warning.)
        run: pnpm guard:tokens
      - name: UI-standard ratchet
        if: steps.scope.outputs.code == 'true'
        # The other half of DESIGN_SYSTEM.md: seven counts (PageShell drift, icon-registry
        # drift, nested interactive controls, raw hex, arbitrary colour values, palette
        # classes the token guard's regex cannot see, un-prefixed multi-column grids) vs
        # scripts/ui-standard-baseline.json. Same ratchet contract as the token guard —
        # counts may only go down. Added 2026-08-18 because the standard had been measuring
        # itself in prose since 2026-07-14 and the prose rotted: the doc claimed 57% of pages
        # opted out of PageShell while the real figure had reached 82%. A number in a
        # baseline file cannot go stale silently. It is a TEXT SCAN — it sees none of layout,
        # contrast or rendering; green means "no new instances of seven specific mistakes".
        # (Job `name:` above deliberately unchanged — verbatim required-check string.)
        run: pnpm guard:ui
      - name: Knowledge-base index guard
        # "An unindexed doc is an unread doc" (TEAM_PRACTICES). Fails on a
        # knowledge-base/*.md missing from the index, or an index link pointing at a
        # path that does not exist. Deterministic — it reads only repo contents, which
        # is why it belongs in the required gate while its sibling doc-freshness guard
        # does NOT: that one goes overdue on a calendar date and would block every
        # merge in the repo for a reason no PR caused. See doc-freshness.yml.
        # (Job `name:` above deliberately unchanged — verbatim required-check string;
        # see the rename warning.)
        run: pnpm guard:kb
      - name: Routine seat roster
        # CHARTER.md §3/§3a and TEAM.md's seating chart are GENERATED from
        # knowledge-base/routines/SEATS.tsv. This fails when they disagree with it, when an
        # active seat's definition file is missing, when a living doc names a scheduled task
        # the roster does not know, or when a paused/unregistered seat carries no reason and
        # no reviewBy.
        #
        # WHY IT EXISTS. On 2026-08-24 §3 presented sixteen live seats; the scheduler held
        # six. Ten definitions sat on disk unregistered — Evening Triage among them, the seat
        # that reads every other seat's report — and TEAM.md marked three of the ten "yes,
        # registered". §11 has always said a definition without a registration is a fossil;
        # nothing enforced it, which is §0 recurring inside the file that records it.
        #
        # --no-freshness: the roster also carries a `Registry read` date, because no CI job
        # can read either scheduler and the roster is therefore a snapshot. That half is
        # calendar-driven and stays OUT of the required check for the same reason the
        # doc-freshness guard does (see doc-freshness.yml) — it would go red on a date, for a
        # reason no PR caused. `pnpm checkup` and seat-roster.yml run the full check.
        run: pnpm guard:seats --no-freshness
      - name: Gating reality (a required field nothing collects)
        if: steps.scope.outputs.code == 'true'
        # A completeness scorer marks a field `required`; nothing under client/src ever
        # collects it. Every real file then fails the gate forever while every SEEDED file
        # sails through — so the suite is green and the gate is impassable.
        #
        # WHY IT EXISTS. #491 (42813a0d0e2e): "section 5 required a citizenship column
        # nothing writes, blocking every application". Its own commentary names the
        # mechanism: "It went unnoticed because server/scripts/seedDemoFile.ts sets the
        # field, so demo files passed the gate that no genuine file could." Scored against
        # the 45 real shipped defects of 2026-07-03..08-23, this check is worth 2/45 — more
        # than any intervention proposed at the time, none of which scored above zero.
        #
        # The baseline is a NAMED SET, not a count, unlike its sibling ratchets: fix one
        # unsatisfiable field and introduce another and a count stays level and reports
        # success. Swapping one instance of the defect for another IS the defect.
        run: pnpm guard:gating
      - name: Vocabulary registry (who says these are the legal values)
        if: steps.scope.outputs.code == 'true'
        # 184 closed value sets declare what a thing may hold. None recorded WHO SAYS SO,
        # and that is the gap behind "the jumbo advisory used the 2024 limit" (#606),
        # "every file was delivered as fixed-rate, including the ARMs" (F-053) and
        # "emit valid ULDD LoanPurposeType enum" (F-019).
        #
        # shared/vocabularies/REGISTRY.tsv is GENERATED; only provenance is hand-entered,
        # in authorities.tsv, kept separate so regenerating cannot destroy it. Four rules:
        # a vocabulary with no consumer (LOAN_STAGES autocompleted from the barrel for
        # weeks while five values short of the real list); two names for one value set;
        # a ULAD-governed set that no longer matches docs/fannie-mae/schemas/
        # ulad-enumerations.tsv; and a status column with no vocabulary.
        #
        # Ten ULAD divergences are BASELINED, not fixed — MortgageType ships "USDA" where
        # ULAD says "USDARuralDevelopment". Changing a delivered enumeration changes what
        # goes to Fannie Mae; that is a compliance decision, not a cleanup.
        #
        # Runs the extractor in --check mode first: a stale index would make every value
        # look compliant, which is worse than no index at all.
        run: pnpm guard:vocab
      - name: Doc staleness ratchet
        # Dead vocabulary in LIVING docs vs scripts/doc-staleness-baseline.json
        # (ratchet: counts may only go down). Metrics: kb/ paths, npm-as-instruction,
        # launch-sprint references, the old repo name, the dead Vercel host. Immutable
        # history (archive/, logs/, routines/reports/, CHANGE_LEDGER, the teardown raw
        # notes) is excluded — a dated record carrying an old name is correct history,
        # not rot. Born from the 2026-08-18 knowledge-file audit: TEAM_PRACTICES held
        # dead pointers while its freshness line was green, because the freshness guard
        # attests verification recency and nothing attested vocabulary. Deterministic
        # (repo contents only), so it belongs in the gate per the KB-index guard's rule
        # above. Run with --list for exact lines. (Job `name:` above deliberately
        # unchanged — verbatim required-check string; see the rename warning.)
        run: pnpm guard:staleness
      - name: Citation ratchet
        # Backticked repo paths in living docs that resolve to nothing, vs
        # scripts/citation-baseline.json (ratchet: may only go down). kb-index-guard
        # proves every KB doc is indexed and every INDEX link resolves; it does not
        # look INSIDE a document. This does. Added 2026-08-18 after a sweep found a
        # security threat model listing `server/routes/borrower.ts` among its
        # highest-risk areas months after that file became a directory, and L1/L2
        # citing each other by pre-rename filenames. A ratchet rather than a hard zero
        # on purpose: two thirds of the initial 56 were CORRECT — records of deletions,
        # naming conventions, template placeholders, and proposals whose whole point is
        # that the file is absent. Run --list to triage.
        run: pnpm guard:citations
      - name: Security-review guard (TEAM_PRACTICES §9)
        # Fails when the PR touches a §9 trigger (PII vault/encryption, auth/sessions,
        # role gates, uploads, outbound messaging, PII-adjacent logging) and the PR body
        # records no security review. §9 is binding but was unenforceable: CODEOWNERS +
        # required code-owner review is the usual mechanism, and it cannot work with a
        # single collaborator — GitHub forbids self-approval and enforce_admins is on, so
        # it would deadlock every §9 PR. This enforces the ARTIFACT instead of a second
        # approver. It proves a review was written down, never that it was correct, and it
        # cannot see two §9 triggers at all (a PII column in shared/schema/, a new PII
        # sub-processor) — those stay human judgement. (Job `name:` above deliberately
        # unchanged — verbatim required-check string; see the rename warning.)
        env:
          # Via env, never inlined into run: — a PR body is attacker-controlled text and
          # ${{ }} interpolation into a shell script is a command-injection vector.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # pipefail so a git failure reds the gate instead of yielding an empty diff that
        # the guard would read as "no triggers touched" and pass.
        shell: bash
        run: |
          set -euo pipefail
          # Via FILES, not env vars. `git diff -U0` on a large PR exceeds Linux's
          # MAX_ARG_STRLEN (131,072 bytes — the per-STRING environment cap, not the
          # total-size one). Past it, execve fails with E2BIG and this step dies as
          # `pnpm: Argument list too long` before the guard runs at all — a
          # misleading infra failure reported AFTER every real check in the gate has
          # passed. First hit at 137,761 bytes on a documentation-heavy PR; the
          # guard reads *_FILE in preference to the inline vars.
          # Diff from the MERGE-BASE, not the base branch tip. Two-dot compares
          # endpoints, so every file `main` gained after the branch point was attributed
          # to the PR — and because this guard's remedy is "add a `## Security review`
          # heading", the cheapest way past a phantom failure was to attest to reviewing
          # code the PR never touched: the exact habit the gate exists to prevent
          # (F-0818-16 — two-dot reported 68 files on #567 where 4 changed, and 12 on
          # #569 where 5 changed; `server/services/emailService.ts`, a §9 trigger, landed
          # on main the same day and would have been charged to any PR branched before it).
          #
          # The merge-base is resolved EXPLICITLY rather than with `A...B` shorthand: a
          # branch with no common ancestor makes `git diff A...B` exit non-zero, and under
          # `set -e` that kills the step with a bare `fatal: no merge base` — an
          # infra-looking failure on a security control. That case is live, not
          # theoretical (PR #542's orphan branch). When it happens we fall back to the
          # base tip, which OVER-reports: the safe direction for this guard, since more
          # files can only demand more review, never less.
          if MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            DIFF_BASE="$MERGE_BASE"
          else
            DIFF_BASE="$BASE_SHA"
            echo "::warning::§9 guard: no merge-base between base and head; falling back to the base tip. The changed-file list may over-report."
          fi
          git diff --name-only "$DIFF_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed_files.txt"
          git diff -U0 "$DIFF_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed_lines.diff"
          CHANGED_FILES_FILE="$RUNNER_TEMP/changed_files.txt" \
          CHANGED_LINES_FILE="$RUNNER_TEMP/changed_lines.diff" \
            pnpm guard:security

      - name: Selling Guide authority guard (TEAM_PRACTICES §10)
        # Fails when the PR changes Guide-governed logic (underwriting, income, AUS,
        # delivery) without naming the governing Selling Guide section, and when any
        # added line cites a section the committed edition does not contain. The second
        # rule is the load-bearing one: the Guide renumbers between editions and a stale
        # cite does not announce itself — when self-employment income moved off B3-3.2 on
        # 2026-03-04, six sites kept citing the old chapter and the URL still returned 200.
        # Like the §9 guard it proves the citation was WRITTEN DOWN, never that the reading
        # is correct. It is INERT until the Guide corpus lands on the branch, and says so
        # loudly rather than passing silently. (Job `name:` above deliberately unchanged.)
        env:
          # Via env, never inlined into run: — the PR body is attacker-controlled text.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Own temp filenames so this step never depends on the §9 step's ordering.
          # Explicit merge-base with a base-tip fallback, for the same reasons documented
          # on that step: two-dot over-attributes files the PR never touched, and `A...B`
          # shorthand kills the step outright on a branch with no common ancestor.
          if MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            DIFF_BASE="$MERGE_BASE"
          else
            DIFF_BASE="$BASE_SHA"
            echo "::warning::§10 guard: no merge-base between base and head; falling back to the base tip. The changed-file list may over-report."
          fi
          git diff --name-only "$DIFF_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/sg_changed_files.txt"
          git diff -U0 "$DIFF_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/sg_changed_lines.diff"
          CHANGED_FILES_FILE="$RUNNER_TEMP/sg_changed_files.txt" \
          CHANGED_LINES_FILE="$RUNNER_TEMP/sg_changed_lines.diff" \
            pnpm guard:authority
      - name: Selling Guide corpus coherence
        # The corpus fact layer (section-index.tsv, toc.json, links.json,
        # manifest.json, INDEX.md) is ONE derivation from one PDF; this proves the
        # files agree with each other and with the extractor's pinned identity.
        # Node-only, <1s, INERT until the corpus lands on the branch. DELIBERATELY
        # NOT behind the scope step: `^docs/` classifies as inert there, so a
        # corpus-only PR is exactly the one this must run on —
        # tests/ciTriggers.test.ts pins that property. (Job `name:` above
        # deliberately unchanged — verbatim required-check string.)
        run: pnpm guard:corpus
      - name: Selling Guide coverage map current
        # SELLING_GUIDE_COVERAGE.md is rendered from selling-guide-coverage.json +
        # section-index.tsv; a stale render was previously ungated — guard:coverage
        # existed in package.json wired into NOTHING, so the 423-row map could
        # silently drift from its status file. INERT-safe by design; not
        # scope-gated for the same reason as the step above.
        run: pnpm guard:coverage
      - name: Selling Guide conformance register
        # SELLING_GUIDE_CONFORMANCE.md records what our code agrees and disagrees
        # with in the Guide, and six decision-path comments cite its gap ids as
        # stable keys — while nothing read it. On 2026-08-22 two sessions each
        # added a pair of findings and each numbered them C-9/C-10: four findings,
        # two ids, gate green throughout. This checks the register's SHAPE only —
        # unique ids, section ids that resolve in the committed edition, the
        # edition stamp, and that code-cited ids exist. It proves nothing about
        # whether an entry's CLAIM is true; that is the scrub loop's job. INERT
        # until the corpus lands; not scope-gated, same reason as the steps above.
        run: pnpm guard:conformance
      - name: Restore pip cache (extraction proof)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          # Keyed on the extractor source, which carries PYMUPDF_PINNED — a pin
          # bump changes the hash and misses the cache, which is the correct
          # (merely slower) behaviour.
          key: pip-pymupdf-${{ hashFiles('scripts/extract-selling-guide.py') }}
      - name: Selling Guide extraction proof (recover → extract → verify)
        # The full proof the two cheap guards cannot give: recover the PDF from
        # this repo's own git history (fetch-depth: 0 above makes the blob
        # reachable), re-extract, and verify the tracked fact layer is exactly what
        # the PDF yields. The pymupdf version is DERIVED from the extractor's
        # PYMUPDF_PINNED constant, never restated here — a floating version would
        # red this gate for every open PR the day upstream changes text
        # extraction, so version bumps are deliberate PRs that regenerate the
        # fact layer. venv because ubuntu-latest's system python is externally
        # managed (PEP 668); pip retries ×3 because a PyPI flake is a re-run,
        # never a continue-on-error — this is the gate. Writes only gitignored
        # files into the work tree. NOT scope-gated, same reason as above.
        # (Job `name:` above deliberately unchanged.)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/extract-selling-guide.py ]; then
            echo "INERT — extractor not on this merge ref"; exit 0
          fi
          PIN="$(sed -n 's/^PYMUPDF_PINNED = "\(.*\)"$/\1/p' scripts/extract-selling-guide.py)"
          if [ -z "$PIN" ]; then
            echo "cannot derive PYMUPDF_PINNED from the extractor — fix the anchor, do not hard-code"; exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/sg-venv"
          for i in 1 2 3; do
            if "$RUNNER_TEMP/sg-venv/bin/pip" -q install "pymupdf==$PIN"; then break; fi
            if [ "$i" = 3 ]; then echo "pip install pymupdf==$PIN failed after 3 attempts"; exit 1; fi
            sleep $((i * 10))
          done
          "$RUNNER_TEMP/sg-venv/bin/python" scripts/extract-selling-guide.py --check
      - name: Query-key convergence guard
        if: steps.scope.outputs.code == 'true'
        # TWO checks, both behind this one script. `invalidateQueries` is the only
        # write→read feedback mechanism in the client, so a key that matches
        # nothing is a mutation that silently refreshes nothing.
        #
        # 1. query-key-guard.cjs (SHAPE) — fails on an interpolated template-string
        #    queryKey for an /api endpoint. Such a key joins to the right URL but is
        #    invisible to array-prefix invalidateQueries — the #297 stale-panel bug
        #    class. Not anchored to `queryKey:`, so hoisting the template into a
        #    `const` no longer evades it.
        #
        # 2. query-key-reachability.cjs (WIRING) — fails when an /api invalidation
        #    matches NO fetch key, or when a fetch key sits in a subtree its own
        #    file invalidates yet is spelled so the invalidation misses it.
        #    partialMatchKey compares arrays ELEMENT BY ELEMENT: ["/api/x"] does
        #    NOT match ["/api/x/y"]. Seven dead invalidations shipped before this
        #    existed, the worst leaving Task Operations' queue stale after every
        #    status change.
        #
        # Green as landed; build keys from the factories in
        # client/src/lib/queryClient.ts. (Job `name:` above deliberately unchanged
        # — verbatim required-check string; see the rename warning.)
        run: pnpm guard:querykeys
      - name: Guard scripts parse
        # `tsc` covers the app; NOTHING covered scripts/*.cjs, and none of them is
        # executed by any other gate step. So a syntax error in a guard shipped to
        # `main` green — #594 put a backtick inside browser-probe.cjs's CHECKS
        # template literal, which terminated the string. Every probe run crashed
        # from then on, and a sweep that grepped the output for defects found none
        # in a stack trace and reported the pages CLEAN. That is the
        # guard-with-no-artifact trap (routines/LESSONS.md 2026-08-12) reached by a
        # new route: not a guard that never ran, a guard that could not run and
        # whose silence was read as a pass.
        #
        # `node --check` is a parse, not a test: it would not catch a logic error,
        # and it cannot see inside CHECKS (that string is evaluated in the browser,
        # not by node). It catches exactly the class that got through, in ~1s.
        run: |
          set -e
          for f in scripts/*.cjs; do node --check "$f"; done
          echo "$(ls scripts/*.cjs | wc -l) guard script(s) parse"
      - name: Production build
        if: steps.scope.outputs.code == 'true'
        # The gate used to prove only that the code TYPECHECKS. `tsc --noEmit` never
        # runs vite or esbuild, so a broken import, a failing vite plugin, or a
        # client-library bump that only explodes at bundle time reached `main` green
        # and the deploy died on the platform — where a failed build is invisible,
        # because the last good deployment keeps serving (#268/#278/#277 sat
        # unshipped with the site up and every check green; the same shape recurred
        # on Railway 2026-08-06, nine consecutive failed deploys, nothing alerting).
        #
        # This is the SAME command Railway runs (`railway.json` buildCommand ->
        # `pnpm build`), so it catches our build breaking before merge. It cannot
        # prove the DEPLOY succeeded — platform-side failure after a good build is
        # a different signal, owned by the `verify-deploy` job.
        #
        # Runs BEFORE the boot step below so a database failure there can never
        # mask a broken bundle. (Job `name:` above deliberately unchanged —
        # verbatim required-check string; see the rename warning.)
        run: pnpm build
      - name: Client bundle-size ratchet
        if: steps.scope.outputs.code == 'true'
        # Measures the ARTIFACT the step above just produced, so it must stay after
        # it — the guard fails loudly rather than skipping if dist/public is absent,
        # because a size guard that passes with nothing to measure is the one state
        # it cannot judge (CHARTER.md §10, "a guard only answers its own question").
        #
        # Gates the EAGER ENTRY GRAPH only — the entry chunk plus its modulepreloads,
        # i.e. what a first-time visitor downloads before anything renders. Lazy route
        # chunks are reported but never gated, so adding a page cannot fail CI; that
        # would train everyone to bump the baseline reflexively and kill the ratchet.
        #
        # Gates RAW bytes, not gzip. The first version gated gzip and went red here on
        # an unchanged bundle: Vite's content hashes churn between builds (fixed-width,
        # so sizes hold but byte sequences shift, changing compressibility), and zlib
        # differs between Node 22 and the 24.x this job runs. Raw is invariant under
        # both. gzip is printed for humans and gated on by nothing.
        #
        # Complements tests/clientSchemaImports.test.ts rather than repeating it: that
        # test forbids ONE source-level cause (a value import of the @shared/schema
        # barrel, which shipped 174 table definitions to every visitor in #482); this
        # counts bytes, so it also catches a fat dependency, a de-lazied route, or a
        # barrel from any other module. #482 records that removing every client value
        # import was not enough on its own. (Job `name:` above deliberately unchanged
        # — verbatim required-check string; see the rename warning.)
        run: pnpm guard:bundle
      - name: Self-host artifact boots (Railway migration path)
        if: steps.scope.outputs.code == 'true'
        # Build success ≠ boot success (the 2026-07-17 postmortem rule, aimed at
        # the persistent-host bundle Railway actually runs). The `Production
        # build` step above produced dist/index.js; this step applies the
        # migration journal to the disposable Postgres service, boots it with
        # NODE_ENV=production, and requires /api/health to answer 200 — proving
        # bundle + boot wiring (encryption init, seeds, routes, static mount) +
        # DB reachability end to end. Catches the import-time death class
        # (e.g. require(esm)) that a green build hides.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/selfhost_boot
        run: |
          pnpm db:migrate
          # Throwaway high-entropy secrets: production boot validation refuses
          # short ones (SESSION_SECRET >= 32 chars — fail-closed by design).
          NODE_ENV=production PORT=3999 \
          SESSION_SECRET="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          PII_HASH_SALT="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          CREDIT_ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" \
          node dist/index.js > /tmp/selfhost.log 2>&1 &
          BOOT_PID=$!
          CODE=000
          for i in $(seq 1 45); do
            CODE="$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3999/api/health 2>/dev/null || true)"
            CODE="${CODE:-000}"
            [ "$CODE" = "200" ] && break
            kill -0 "$BOOT_PID" 2>/dev/null || break
            sleep 1
          done
          kill "$BOOT_PID" 2>/dev/null || true
          echo "self-host boot answered HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "--- server log ---"
            cat /tmp/selfhost.log
            echo "::error::dist/index.js failed to boot and serve /api/health — the self-host bundle is broken"
            exit 1
          fi

      - name: Integration lane (HTTP, against the built bundle)
        if: steps.scope.outputs.code == 'true'
        # The 18-file HTTP suite has never run in CI — only `pnpm preflight` ran it, so it
        # gated nothing and its findings arrived only when someone ran preflight by hand
        # (HO-0822-U2). It is the only lane exercising real routing, auth, CSRF and the
        # Postgres lookup matrices end to end; the unit lanes are hermetic by design.
        #
        # DEVELOPMENT mode, deliberately. The suite authenticates through /api/test-login,
        # which hard-404s under NODE_ENV=production, and some files omit the Origin the
        # production CSRF guard requires. Same dist bundle the step above just proved boots
        # in production mode — only the posture differs.
        #
        # SEEDED, not just migrated. lookupMatrixCoverageGap and lookupMatrixLifecycle read
        # the Postgres policy matrices, and resolveMatrixValue throws rather than guessing
        # when a row is absent — an unseeded database would fail this lane for a reason that
        # is not the code.
        #
        # RATE LIMITS. RATE_LIMIT_RELAXED lifts the auth limiter (20/15min) and the general
        # API limiter (500/15min) for this integration server. The full suite exceeds both
        # budgets in one pass. server/services/rateLimitPolicy.ts ignores the flag when
        # NODE_ENV=production, and the endpoint-specific upload, extraction, vendor, lead,
        # webhook, telemetry and email limiters remain active here.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/selfhost_boot
        run: |
          set -uo pipefail
          # GRIDS BEFORE CONTENT, and both are required — scripts/local-db.sh says why, and the
          # first CI run of this step proved it: `db:seed` alone left FANNIE_LLPA unseeded, the
          # content seed logged "CRITICAL COMPLIANCE ERROR: Required matrix configuration
          # [FANNIE_LLPA]", and all ten pricing/underwriting endpoints answered 500 because
          # resolveMatrixValue throws rather than guessing. Nothing in package.json calls
          # seedLendingGrids, which is exactly why a fresh database cannot price a loan.
          ./node_modules/.bin/tsx server/scripts/seedLendingGrids.ts
          DEV_TEST_PASSWORD=test1234 pnpm db:seed
          EXTRACTION_SIMULATE=true ANTHROPIC_API_KEY="" CLAUDE_API_KEY="" \
          NODE_ENV=development PORT=4000 RATE_LIMIT_RELAXED=true \
          DEV_TEST_PASSWORD=test1234 \
          SESSION_SECRET="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          PII_HASH_SALT="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          CREDIT_ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" \
          node dist/index.js > /tmp/integration-server.log 2>&1 &
          SRV_PID=$!
          CODE=000
          for i in $(seq 1 45); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/health 2>/dev/null || true)"
            CODE="${CODE:-000}"
            [ "$CODE" = "200" ] && break
            kill -0 "$SRV_PID" 2>/dev/null || break
            sleep 1
          done
          if [ "$CODE" != "200" ]; then
            echo "--- server log ---"; cat /tmp/integration-server.log
            kill "$SRV_PID" 2>/dev/null || true
            echo "::error::the integration server never answered /api/health — the lane did not run"
            exit 1
          fi
          TEST_BASE_URL=http://localhost:4000 DEV_TEST_PASSWORD=test1234 pnpm test:integration
          RC=$?
          kill "$SRV_PID" 2>/dev/null || true
          if [ "$RC" != "0" ]; then
            echo "--- server log (last 100 lines) ---"; tail -100 /tmp/integration-server.log
            echo "::error::the integration lane failed"
            exit "$RC"
          fi

  migrate-prod:
    name: migrate-prod (apply pending migrations)
    # ▶️ RESUMED 2026-08-22, after the pause's premise turned out to be false and cost a
    # 35-minute total authentication outage in production.
    #
    # THE PAUSE, AND WHY IT ENDED. On 2026-08-19 this was paused on founder direction:
    # development was going local-only and "the Railway production service is being taken
    # down", so there was said to be no prod app to migrate for. The takedown never
    # happened. Railway kept auto-deploying every merge to `main`, the site stayed public,
    # and the journal ran ahead of the database exactly as the pause note predicted —
    # while nothing in CI was able to say so.
    #
    # It came due on 2026-08-22. PR #609 merged migration 0057 (users.last_failed_login_at).
    # This job did not fire, so the column was never created, while the deployed code
    # selects it on EVERY query against `users`. Login, signup and password reset each
    # returned 500 — `error: column "last_failed_login_at" does not exist`, in the Railway
    # deploy logs — until the migration was applied by manual dispatch (run 32592906537).
    #
    # 🚨 THE CHECK THAT DID NOT SAVE US, so nobody reaches for it next time: `verify-deploy`
    # below would have stayed GREEN throughout. It asserts prod serves the merged COMMIT,
    # and prod did serve it. The process was alive and the code current; only the schema
    # underneath was wrong. A commit check cannot see a missing column.
    #
    # Steps 3 and 4 of the original resume plan were honoured: dry_run=true was run first
    # (run 32591800451) and listed exactly one pending migration, 0057, which is additive
    # (`ADD COLUMN IF NOT EXISTS`, nullable) and therefore carries no contract-migration
    # data risk. A green dry-run still never executes SQL — it reconciles the journal only.
    #
    # ⚠️ IF THE RAILWAY TAKEDOWN IS STILL THE PLAN, this is the wrong half of the fix:
    # revert it and complete the takedown — or at minimum disable Railway's auto-deploy
    # from `main` — instead. What must not continue is the state this incident happened in:
    # a live, public, auto-deploying production whose migrations nothing applies. Either
    # prod is real and gets its migrations, or it is gone and stops receiving deploys. It
    # cannot be both.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Never run two migrations against prod at once; don't cancel one in flight.
    concurrency:
      group: migrate-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Migration ledger pre-flight
        # Last line of defence, and the only ledger check that ever sees `main` itself:
        # the `gate` job is `if: pull_request`, so nothing validates the ledger on the
        # push that actually triggers an apply. Runs before the migrator so a malformed
        # journal (duplicate idx, missing/un-journalled .sql, filename ≠ idx) aborts the
        # job with prod untouched, instead of being applied in an undefined order.
        # Cheap and offline — reads only the repo's own files, no DB connection.
        run: pnpm guard:migrations
      - name: Apply pending migrations to prod
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Only needed when the API key can see more than one Neon project.
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          # The connection string is piped straight into migrate-prod's env via
          # command substitution: never echoed, never written to GITHUB_ENV, and
          # neither script ever prints it.
          DATABASE_URL="$(node scripts/neon-connection-uri.cjs)" node scripts/migrate-prod.cjs $ARGS

  # ---------------------------------------------------------------------------
  # The gap that let production sit eight commits stale with every check green.
  #
  # On 2026-08-06 nine consecutive Railway deploys failed in the Setup step
  # (`engines.node: "24.x"` is npm range syntax, which mise cannot resolve). A
  # failed Railway deploy does NOT take the site down — it leaves the PREVIOUS
  # container serving. So `gate` was green, `migrate-prod` was green,
  # /api/health answered 200, and nothing anywhere said "the code you merged is
  # not running". It was found by hand, hours later, and only because it had
  # started masking a second fault.
  #
  # This job closes that: after every push to main it asks production which
  # commit it is actually serving, and fails loudly if that is not this one.
  #
  # Deliberately NOT a step inside `gate` (that job is `if: pull_request`, so it
  # never runs on the push that deploys), and deliberately NOT added to branch
  # protection's required contexts — it runs AFTER the merge, so requiring it
  # would deadlock every PR.
  # ---------------------------------------------------------------------------
  verify-deploy:
    name: verify-deploy (prod is serving this commit)
    # ▶️ RESUMED 2026-08-22 alongside `migrate-prod`. Its own note said to restore it BEFORE
    # the first Railway deploy, not after; Railway has been deploying every merge throughout
    # the pause, so this restore is overdue rather than early.
    #
    # 🚨 KNOW EXACTLY WHAT THIS CATCHES, AND WHAT IT CANNOT. It catches the stale-container
    # failure: a failed Railway build leaves the PREVIOUS container serving, so the site
    # stays up, /api/health answers 200, and every other check stays green while the code
    # you merged is not running.
    #
    # It does NOT catch a schema mismatch, and on 2026-08-22 that distinction was the whole
    # incident: prod served the correct commit with a missing column while every login
    # 500'd, and this job would have been green for all 35 minutes. Matching commits prove
    # the right CODE is running, never that the DATABASE underneath it agrees. Do not cite
    # a green verify-deploy as evidence that a deploy is healthy — that is the same
    # unearned-success shape as reading /api/health's 200 as proof a migration applied.
    if: github.event_name == 'push'
    # 🚨 MUST NOT BLOCK THE WORKFLOW. This job and Railway's "Wait for CI"
    # setting are mutually recursive: Wait for CI holds the deploy until every
    # GitHub workflow for the commit succeeds, while this job waits for that
    # same deploy to reach production. Each waits for the other, this job times
    # out after 20 minutes, the workflow fails, and Railway marks the
    # deployment SKIPPED — which is TERMINAL, with no retry. Every subsequent
    # merge repeats it, so the result is a permanent, silent deploy freeze.
    #
    # Observed live on 2026-08-06: deployments b80afca2 (#425) and ed553cf8
    # (#428) both sat in WAITING behind this job minutes after it first merged.
    #
    # `continue-on-error` breaks the cycle without giving up the signal: the job
    # still turns red and still names the stuck commit, but the WORKFLOW
    # concludes success, so Wait for CI releases the deploy. The hard alarm is
    # Railway's own deployment notifications; this is the in-repo tripwire.
    continue-on-error: true
    # Ordered after the migrator so a schema failure is reported as itself
    # rather than as a mysterious stale deployment.
    needs: migrate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll /api/health until it reports this commit
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          # Railway builds + boots in ~90s; 18 x 20s = 6 min of headroom for a
          # queued build. `curl -f` keeps a 5xx from being parsed as a payload.
          #
          # WAS 60 x 20s = 20 min. Measured over the 14 days to 2026-08-20: 125 runs,
          # MEDIAN 84s, and 83 of them finished inside 2 minutes. The tail is not a
          # slow deploy — it is a deploy that never happened: 15 runs polled the full
          # 20 minutes and then failed, which is 300 billable minutes of a runner
          # sleeping to re-learn something it already knew at minute six. Every one of
          # those 15 is a FAILED Railway build, and the fix for that is the runbook,
          # not more waiting. Shortening the window makes the alarm arrive SOONER and
          # costs nothing but the ability to wait out a >6-minute queue, which the
          # measured distribution has never contained. If a legitimately slow build
          # ever trips this, the recovery is unchanged and cheap: re-run the job.
          # HOST: the Railway origin, never `www`. This job's entire question is
          # "is prod serving THIS commit", and `www.homiquity.com` answers through
          # Squarespace DNS — a stale record, a redirect, or a cached edge response
          # can all make it answer for something other than the Railway service
          # this workflow just deployed to. CLAUDE.md and the DNS runbook both
          # state the rule: machine-to-machine uses `*.up.railway.app`; `www` is
          # for humans. A deploy verifier reading the wrong origin is the one
          # failure mode it cannot have, because a false GREEN here is exactly the
          # silent-stale-prod condition the job exists to catch.
          for i in $(seq 1 18); do
            got="$(curl -sf --max-time 10 https://homiquity-production.up.railway.app/api/health \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' \
                   2>/dev/null || true)"
            if [ "$got" = "$EXPECTED" ]; then
              echo "prod is serving $EXPECTED"
              exit 0
            fi
            echo "attempt $i/18 — serving '${got:-<none>}', want '$EXPECTED'"
            sleep 20
          done
          echo "::error::prod is NOT serving $EXPECTED after 6 minutes. The merge did not ship."
          echo "Check Railway → project Homiquity → service Homiquity → Deployments for a FAILED build."
          echo "A failed deploy leaves the previous one serving, so the site being UP is not evidence it shipped."
          exit 1
