# Production sweep scheduler — THE scheduler. There is no twin: the platform
# cron block it once mirrored was deleted at the Railway cutover.
#
# Consequence: a schedule removed or mistyped here is a sweep that silently
# never runs again, and nothing else will notice. That is the "a sweep nobody
# schedules never runs" invariant, pinned for letter-expiry and task-escalation
# by tests/letterIntegrity.test.ts and tests/taskEngineSlaSeed.test.ts — those
# tests assert BOTH that the cron expression is registered below AND that the
# resolve step maps it to a job path, because an unmapped expression fires a
# run that curls nothing.
#
# Auth: /api/jobs/* accepts `Authorization: Bearer <CRON_SECRET>`
# (server/routes/jobs.ts) and degrades to admin-session-only when unset.
# FOUNDER ACTION REQUIRED: create the CRON_SECRET **repository secret**
# (Settings → Secrets and variables → Actions) with the SAME value as the
# app's CRON_SECRET env var — until then every run here fails loudly, which
# is the wanted posture (a scheduler that silently no-ops hides a dead sweep).
#
# GitHub exposes only WHICH cron expression fired (github.event.schedule), so
# one workflow carries all eight expressions and the resolve step maps the
# expression back to its job path. An expression with no mapping fails the
# run rather than skipping — editing a schedule without its case arm must be
# loud. Scheduled workflows run against the default branch only.

name: cron-jobs

on:
  schedule:
    - cron: "0 13 * * *" # /api/jobs/lifecycle
    - cron: "0 12 * * *" # /api/jobs/rate-lock-alerts
    - cron: "30 12 * * *" # /api/jobs/letter-expiry
    - cron: "0 14 * * *" # /api/jobs/adverse-action-delivery
    - cron: "45 13 * * *" # /api/jobs/task-escalation
    - cron: "17 11 * * 1" # /api/jobs/aggregate-data (Mondays)
    - cron: "15 13 * * *" # /api/jobs/credit-monitoring
    - cron: "30 11,23 * * *" # /api/jobs/core-provider-canaries (twice daily; proof expires after 24h)
  # Manual lever: lets the founder prove CRON_SECRET end-to-end without
  # waiting for a schedule, and re-fire a missed sweep after an outage.
  workflow_dispatch:
    inputs:
      job:
        description: "Sweep to trigger (path suffix of /api/jobs/)"
        required: true
        type: choice
        options:
          - lifecycle
          - rate-lock-alerts
          - letter-expiry
          - adverse-action-delivery
          - task-escalation
          - aggregate-data
          - credit-monitoring
          - core-provider-canaries

permissions:
  contents: none

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve job from schedule
        id: resolve
        env:
          FIRED: ${{ github.event.schedule }}
          DISPATCHED: ${{ inputs.job }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            job="$DISPATCHED"
          else
            case "$FIRED" in
              "0 13 * * *") job="lifecycle" ;;
              "0 12 * * *") job="rate-lock-alerts" ;;
              "30 12 * * *") job="letter-expiry" ;;
              "0 14 * * *") job="adverse-action-delivery" ;;
              "45 13 * * *") job="task-escalation" ;;
              "17 11 * * 1") job="aggregate-data" ;;
              "15 13 * * *") job="credit-monitoring" ;;
              "30 11,23 * * *") job="core-provider-canaries" ;;
              *)
                echo "::error::No job mapped for schedule '$FIRED' — a cron expression was edited without updating this case list"
                exit 1
                ;;
            esac
          fi
          if [ "$job" = "core-provider-canaries" ]; then
            method="POST"
          else
            method="GET"
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "method=$method" >> "$GITHUB_OUTPUT"
      - name: Trigger the sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ steps.resolve.outputs.job }}
          METHOD: ${{ steps.resolve.outputs.method }}
          # The RAILWAY service domain, deliberately NOT www.homiquity.com.
          #
          # This call is machine-to-machine — no human ever sees it — so there is
          # nothing to gain from the vanity hostname and one thing to lose:
          # www.homiquity.com is a CNAME in a Squarespace-hosted zone
          # (nsd1..nsd4.squarespacedns.com) that is neither Railway-managed nor
          # in this repo. On 2026-08-06, while that zone was being edited, three
          # sweeps died on `curl` exit 6 — could not resolve host — and because
          # this job has no failure alarm, nothing said so.
          #
          # *.up.railway.app is served and certificated by the platform the app
          # actually runs on, so the scheduler no longer depends on a third
          # party's DNS to reach a service in the same provider. Keep
          # www.homiquity.com for user-facing traffic and for the CI
          # verify-deploy probe, which is SUPPOSED to prove the public path.
          SWEEP_HOST: https://homiquity-production.up.railway.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — sweep NOT triggered (founder: create it with the same value as the app env var)"
            exit 1
          fi
          # -f fails the step on any HTTP >= 400; --retry re-attempts curl's
          # transient set (timeouts, 429, 5xx) so a deploy-window blip does
          # not surface as a missed sweep.
          #
          # `--retry-all-errors` is what covers DNS. curl's default retry set is
          # transient HTTP + timeouts; a resolution failure exits 6 IMMEDIATELY
          # with no retry, which is exactly how three sweeps were lost on
          # 2026-08-06 (runs 31109129025 rate-lock-alerts, 31113006591
          # letter-expiry, 31115455014 lifecycle — all `exit code 6`, all in
          # ~15s). Belt and braces alongside the host change below.
          curl -sf --retry 3 --retry-all-errors --max-time 120 \
            -X "${METHOD}" \
            -H "Origin: ${SWEEP_HOST}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SWEEP_HOST}/api/jobs/${JOB}"
